services:
  app:
    build: .
    container_name: rectile-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # discrete vars (not a URL) so passwords with ?&# need no encoding
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: rectile
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rectile
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
      RECTILE_SEED_DEMO: ${RECTILE_SEED_DEMO:-0}
      # web push + daily digest (optional — push disabled when unset)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      RECTILE_TZ: ${RECTILE_TZ:-Europe/Berlin}
      RECTILE_DIGEST_TIME: ${RECTILE_DIGEST_TIME:-08:00}
      # Proton Mail Bridge on the compose host (optional — /mail shows setup
      # panel when unset). MAIL_SOCKET_DIR points at the socat unix sockets
      # bind-mounted below; instrumentation.ts forwards loopback TCP to them.
      PROTON_BRIDGE_HOST: ${PROTON_BRIDGE_HOST:-}
      PROTON_BRIDGE_IMAP_PORT: ${PROTON_BRIDGE_IMAP_PORT:-1143}
      PROTON_BRIDGE_SMTP_PORT: ${PROTON_BRIDGE_SMTP_PORT:-1025}
      PROTON_BRIDGE_USER: ${PROTON_BRIDGE_USER:-}
      PROTON_BRIDGE_PASS: ${PROTON_BRIDGE_PASS:-}
      MAIL_ACCOUNTS: ${MAIL_ACCOUNTS:-}
      MAIL_SOCKET_DIR: ${MAIL_SOCKET_DIR:-}
      # cpptutor lesson-console bridge (optional — socket forwarded from the
      # laptop; console shows LAPTOP LINK DOWN when absent)
      CPPTUTOR_BRIDGE_SOCKET: ${CPPTUTOR_BRIDGE_SOCKET:-}
    volumes:
      - /run/rectile-mail:/mailbridge
      - /run/cpptutor:/bridge
    ports:
      # cloudflared on the same host connects to 127.0.0.1:3000;
      # widen to "3000:3000" if the tunnel runs elsewhere on the LAN
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rectile-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # connector token for the "proxmox" tunnel (Zero Trust → Networks →
      # Tunnels); the dashboard routes armadax.xyz → http://app:3000
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: rectile-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rectile
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rectile
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rectile -d rectile"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
